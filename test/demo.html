<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toledo Organizer demo</title>
<link rel="stylesheet" href="../styles/organizer.css">
<style>
  body { margin: 0; padding: 24px; background: #f2f4f8; font: 14px/1.4 "Segoe UI", system-ui, sans-serif; }
  #layout { display: flex; gap: 20px; align-items: flex-start; max-width: 1400px; margin: 0 auto; }
  #mount { flex: 0 0 65%; min-width: 0; }
  #side { flex: 1 1 35%; min-width: 0; }
  html.to-dark body { background: #0f1217; }
  /* The fake Toledo feed only feeds the dashboard; on Toledo it is styled by the theme. */
  .tol-events-widget { display: none; }
  .tol-event { padding: 6px 0; }
  .tol-date, .tol-source { display: block; font-size: 12px; color: #667; }
</style>
<div class="main-content"><div class="container-fluid">
<div id="layout"><div id="mount"><div id="mount-anchor"></div></div><div id="side" class="col-md-4"></div></div>
</div></div>
<!-- Demo data for README screenshots. Open with ?edit=1 for edit mode. Serve the repo root over http. -->
<script>
window.chrome = {
  storage: { local: { get: async () => ({}), set: async () => {} } },
  runtime: { sendMessage: (_msg, cb) => cb({ ok: true }) }
};
</script>
<script src="../src/i18n.js"></script>
<script src="../src/storage.js"></script>
<script src="../src/matcher.js"></script>
<script src="../src/ui.js"></script>
<script src="../src/dashboard.js"></script>
<script>
(async () => {
  const NS = window.ToledoOrganizer;
  const params = new URLSearchParams(location.search);
  // English sample content for ?lang=en screenshots (the interface itself is translated by src/i18n.js).
  const DEMO_EN = {"Tussentijdse toets": "Midterm quiz", "Volledige cursus": "Full course", "Anatomie II: theorie": "Anatomy II: theory", "Fysiologie I": "Physiology I", "Biochemie": "Biochemistry", "Histologie": "Histology", "Klinische chemie 1": "Clinical chemistry 1", "Hematologie": "Haematology", "Medische statistiek": "Medical statistics", "Pathologie": "Pathology", "Farmacologie": "Pharmacology", "Immunologie": "Immunology", "Microbiologie": "Microbiology", "Parasitologie": "Parasitology", "Test hoofdstuk 4": "Quiz chapter 4", "Biochemie [QM1374]": "Biochemistry [QM1374]", "Indienen verslag labo": "Submit lab report", "Mondeling examen": "Oral exam", "Resultaat labo 1": "Lab 1 result", "Slides week 3": "Slides week 3", "Herinnering: inschrijven voor practicum": "Reminder: sign up for the practical", "Nieuwe cursusversie beschikbaar": "New course version available", "Punten tussentijdse toets": "Midterm quiz grades", "Oefeningenbundel": "Exercise booklet", "Welkom bij het vak": "Welcome to the course", "Docent Naam": "Lecturer", "Samenvatting anatomie afwerken": "Finish anatomy summary", "Anatomie II": "Anatomy II", "Labo-verslag nalezen": "Proofread lab report", "Boeken terugbrengen": "Return library books", "Geneeskunde": "Medicine", "1ste fase": "Year 1", "1ste semester": "Semester 1", "2de semester": "Semester 2", "MLT / Biomedische Laboratoriumtechnologie": "Biomedical Laboratory Technology"};
  const L = (text) => (params.get("lang") === "en" && DEMO_EN[text]) || text;

  const v = (inst, code, year, title, available = true) => ({
    rawId: `ULTRA-B-${inst === "KUL" ? "KUL" : "UCLL"}-${code}-${year}`,
    title, originalTitle: title, institution: inst, type: "course", year,
    academicYear: `20${year.slice(0, 2)}-20${year.slice(2)}`,
    available, unavailable: !available, href: available ? "#" : null
  });
  const course = (inst, code, title, years, extra = {}) => ({
    key: `${inst}:${code}`, title, type: "course", institution: inst, code,
    versions: years.map(([y, ok]) => v(inst, code, y, title, ok)), ...extra
  });

  const courses = [
    course("KUL", "E0I54a", L("Anatomie II: theorie"), [["2627", false], ["2526", true]]),
    course("KUL", "E0I12b", L("Fysiologie I"), [["2526", true]]),
    course("KUL", "E0I31a", L("Biochemie"), [["2526", true], ["2425", true]]),
    course("KUL", "E0J08a", L("Histologie"), [["2526", true]]),
    course("UCLL", "QM1359", L("Klinische chemie 1"), [["2627", true]]),
    course("UCLL", "QM1402", L("Hematologie"), [["2627", true]]),
    course("KUL", "E0K77a", L("Medische statistiek"), [["2627", true]]),
    course("KUL", "E0I77a", L("Pathologie"), [["2627", true], ["2526", true]], { semester: 1 }),
    course("KUL", "E0I78a", L("Farmacologie"), [["2526", true]], { semester: 2 }),
    course("KUL", "E0J21a", L("Immunologie"), [["2425", true]]),
    course("UCLL", "QM1511", L("Microbiologie"), [["2526", true]], { semester: 2 }),
    course("UCLL", "QM1520", L("Parasitologie"), [["2627", true]], { semester: 1 })
  ];

  if (params.get("dark") === "1") document.documentElement.classList.add("to-dark");
  if (params.get("accent")) document.documentElement.style.setProperty("--to-user-accent", params.get("accent"));

  // Fake Toledo right column: .col-md-4 > .panel.tol-events-widget with dd/mm/yyyy dated events.
  const fmt = (offset) => {
    const d = new Date(); d.setDate(d.getDate() + offset);
    return `${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")}/${d.getFullYear()}`;
  };
  const side = document.getElementById("side");
  const widget = document.createElement("div");
  widget.className = "panel tol-events-widget";
  // [date (offset in days, or a word), colour, kind, title, source, author, unread]
  const events = [
    [1, 3, "due", L("Test hoofdstuk 4"), L("Biochemie [QM1374]"), null, true],
    [3, 12, "due", L("Indienen verslag labo"), L("Klinische chemie 1"), null, false],
    [9, 5, "test", L("Mondeling examen"), L("Fysiologie I"), null, false],
    [5, 9, "test", L("Tussentijdse toets"), L("Hematologie"), null, true],
    ["Gisteren", 13, "content", "Hoofdstuk 5: Spijsvertering", L("Fysiologie I"), L("Docent Naam"), true],
    ["Gisteren", 4, "announcement", "Les valt uit donderdag", L("Histologie"), "Prof. Peeters", true],
    [-2, 7, "gradebook", L("Resultaat labo 1"), L("Histologie"), null, false],
    [-3, 15, "content", L("Slides week 3"), L("Anatomie II: theorie"), L("Docent Naam"), false],
    [-4, 2, "announcement", L("Herinnering: inschrijven voor practicum"), L("Klinische chemie 1"), "An Janssens", false],
    [-6, 10, "course", L("Nieuwe cursusversie beschikbaar"), L("Medische statistiek"), null, false],
    [-8, 11, "gradebook", L("Punten tussentijdse toets"), L("Biochemie"), null, true],
    [-30, 16, "content", L("Oefeningenbundel"), L("Anatomie II: theorie"), L("Docent Naam"), false],
    [-400, 1, "announcement", L("Welkom bij het vak"), L("Histologie"), "Prof. Peeters", false]
  ];
  events.forEach(([off, color, kind, title, source, author, unread]) => {
    const item = document.createElement("div");
    item.className = `tol-event color-${color} notifications-${kind}${unread ? " tol-unread-item" : ""}`;
    const a = document.createElement("a");
    a.href = "https://toledo.kuleuven.be/x";
    a.addEventListener("click", (e) => { e.preventDefault(); item.classList.remove("tol-unread-item"); });
    const date = document.createElement("span"); date.className = "tol-date"; date.textContent = typeof off === "string" ? off : fmt(off);
    const t = document.createElement("span"); t.className = "tol-title"; t.textContent = title;
    const src = document.createElement("span"); src.className = "tol-source"; src.textContent = source;
    a.append(date, t);
    if (author) {
      const what = document.createElement("span"); what.className = "tol-what-happened";
      const strong = document.createElement("strong"); strong.textContent = author;
      what.append(strong, document.createTextNode(kind === "content" ? " heeft inhoud toegevoegd" : " heeft een mededeling geplaatst"));
      a.append(what);
    }
    a.append(src);
    item.append(a);
    widget.append(item);
  });
  side.append(widget);

  const state = NS.storage.defaultState();
  const iso = (off) => { const d = new Date(); d.setDate(d.getDate() + off); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
  state.tasks = [
    { id: "t1", text: L("Samenvatting anatomie afwerken"), done: false, due: iso(-1), tag: L("Anatomie II"), createdAt: 1, doneAt: null },
    { id: "t2", text: L("Labo-verslag nalezen"), done: false, due: iso(0), tag: null, createdAt: 2, doneAt: null },
    { id: "t3", text: L("Boeken terugbrengen"), done: true, due: null, tag: null, createdAt: 3, doneAt: 4 }
  ];
  state.editMode = params.get("edit") === "1";
  state.pinned = ["KUL:E0K77a"];
  const orderParam = (params.get("order") || "").split(",").filter(Boolean);
  if (orderParam.length) state.dashboard.order = orderParam;
  const langParam = params.get("lang");
  if (langParam === "nl" || langParam === "en") state.language = langParam;
  NS.i18n.setLanguage(state.language);
  state.groups = [
    { id: "med", name: L("Geneeskunde"), parentId: null, order: 0, collapsed: false, color: "#7c5cdb" },
    { id: "f1", name: L("1ste fase"), parentId: "med", order: 0, collapsed: false, color: null },
    { id: "s1", name: L("1ste semester"), parentId: "f1", order: 0, collapsed: false, color: null },
    { id: "s2", name: L("2de semester"), parentId: "f1", order: 1, collapsed: false, color: null },
    { id: "blt", name: L("MLT / Biomedische Laboratoriumtechnologie"), parentId: null, order: 1, collapsed: false, color: "#2f9e7a" },
    { id: NS.storage.OVERIG_ID, name: "Overig", parentId: null, order: 2, collapsed: true, builtIn: true, color: null }
  ];
  const set = (groupId, order, extra = {}) => ({ groupId, hidden: false, defaultVersion: null, versionNames: {}, customTitle: null, color: null, order, ...extra });
  state.courseSettings = {
    "KUL:E0I54a": set("s2", 0, { defaultVersion: "2526", color: "#e5534b" }),
    "KUL:E0I12b": set("s1", 0),
    "KUL:E0I31a": set("s1", 1, { defaultVersion: "2526", versionNames: { "2425": L("Volledige cursus") } }),
    "KUL:E0J08a": set("s2", 1),
    "UCLL:QM1359": set("blt", 0, { color: "#e0a526" }),
    "UCLL:QM1402": set("blt", 1),
    "KUL:E0K77a": set(null, 0)
  };

  const enrollments = courses.flatMap((c) => c.versions.map((x) => ({ ...x, key: c.key, code: c.code })));
  let current = NS.storage.validateImportedState(state);
  const dash = new NS.dashboard.Dashboard({
    getState: () => current,
    setState: async (patch) => { current = { ...current, ...patch }; NS.i18n.setLanguage(current.language); ui.state = current; dash.render(); ui.render(); },
    getCourses: () => courses
  });
  const ui = new NS.ui.OrganizerUI({
    state: current,
    onStateChange: async (next) => { current = next; NS.i18n.setLanguage(current.language); dash.render(); },
    getCourses: () => courses,
    getEnrollments: () => enrollments
  });
  ui.expandedCourses.add("KUL:E0I31a");
  ui.mount(document.getElementById("mount-anchor"));
  dash.mount(side);
  if (params.get("autosort") === "1") ui.openAutoSort();
  if (params.get("settings") === "1") await ui.updateUIState({ settingsOpen: true });
})();
</script>
